<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" class="pinky-svg" id="pinky-vector">
  <defs>
    <!-- Soft gradients for Pinky -->
    <linearGradient id="pinkyEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F6B8CD"/>
    </linearGradient>
    <linearGradient id="pinkyRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A254F"/>
      <stop offset="100%" stop-color="#741F43"/>
    </linearGradient>
    <linearGradient id="pinkyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <radialGradient id="pinkyEyeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9C275A"/>
      <stop offset="60%" stop-color="#741F43"/>
      <stop offset="100%" stop-color="#351421"/>
    </radialGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#741F43" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Tail with subtle swish -->
  <path class="pinky-tail" d="M 55 155 C 30 160 20 135 32 120 C 38 112 48 118 44 128 C 40 138 46 148 65 146" 
        fill="#FFFFFF" stroke="#F6B8CD" stroke-width="3" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="148" rx="42" ry="34" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Back paws -->
  <ellipse cx="64" cy="168" rx="14" ry="10" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2"/>
  <circle cx="64" cy="168" r="4" fill="#F6B8CD" opacity="0.6"/>
  <ellipse cx="136" cy="168" rx="14" ry="10" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2"/>
  <circle cx="136" cy="168" r="4" fill="#F6B8CD" opacity="0.6"/>

  <!-- Front paws -->
  <ellipse cx="88" cy="165" rx="10" ry="14" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2"/>
  <ellipse cx="112" cy="165" rx="10" ry="14" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2"/>

  <!-- Ears -->
  <!-- Left Ear -->
  <g class="pinky-ear-left">
    <path d="M 52 75 C 44 42 56 22 75 32 C 85 37 88 56 86 68 Z" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2.5"/>
    <path d="M 58 68 C 52 46 62 32 73 38 C 79 42 80 54 78 63 Z" fill="url(#pinkyEarGrad)"/>
  </g>
  <!-- Right Ear -->
  <g class="pinky-ear-right">
    <path d="M 148 75 C 156 42 144 22 125 32 C 115 37 112 56 114 68 Z" fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2.5"/>
    <path d="M 142 68 C 148 46 138 32 127 38 C 121 42 120 54 122 63 Z" fill="url(#pinkyEarGrad)"/>
  </g>

  <!-- Head -->
  <path d="M 52 82 C 45 98 48 116 65 125 C 80 133 120 133 135 125 C 152 116 155 98 148 82 C 142 66 128 58 100 58 C 72 58 58 66 52 82 Z" 
        fill="#FFFFFF" stroke="#F6B8CD" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="68" cy="104" rx="8" ry="5" fill="#F6B8CD" opacity="0.6"/>
  <ellipse cx="132" cy="104" rx="8" ry="5" fill="#F6B8CD" opacity="0.6"/>

  <!-- Eyes Container for Expression Switching -->
  <g id="pinky-eyes-normal" class="pinky-eyes">
    <!-- Left Eye -->
    <g class="pinky-eye-left">
      <ellipse cx="78" cy="92" rx="10" ry="12" fill="url(#pinkyEyeGrad)"/>
      <circle cx="75" cy="88" r="4" fill="#FFFFFF"/>
      <circle cx="82" cy="96" r="2" fill="#FFFFFF"/>
      <!-- Eyelash -->
      <path d="M 68 84 Q 76 80 88 84" fill="none" stroke="#351421" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Right Eye -->
    <g class="pinky-eye-right">
      <ellipse cx="122" cy="92" rx="10" ry="12" fill="url(#pinkyEyeGrad)"/>
      <circle cx="119" cy="88" r="4" fill="#FFFFFF"/>
      <circle cx="126" cy="96" r="2" fill="#FFFFFF"/>
      <!-- Eyelash -->
      <path d="M 112 84 Q 124 80 132 84" fill="none" stroke="#351421" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Eyes Happy / Winking State (Toggled via CSS or JS) -->
  <g id="pinky-eyes-happy" class="pinky-eyes-alt" style="display: none;">
    <path d="M 68 94 Q 78 84 88 94" fill="none" stroke="#741F43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 112 94 Q 122 84 132 94" fill="none" stroke="#741F43" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Nose -->
  <polygon points="98,100 102,100 100,103" fill="#E889AA"/>

  <!-- Mouth -->
  <path d="M 94 105 Q 97 109 100 106 Q 103 109 106 105" fill="none" stroke="#741F43" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <!-- Left whiskers -->
  <path d="M 55 98 Q 62 100 68 101" fill="none" stroke="#E889AA" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 53 105 Q 61 106 68 106" fill="none" stroke="#E889AA" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right whiskers -->
  <path d="M 145 98 Q 138 100 132 101" fill="none" stroke="#E889AA" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 147 105 Q 139 106 132 106" fill="none" stroke="#E889AA" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wine Ribbon Collar -->
  <g class="pinky-collar">
    <path d="M 72 124 Q 100 136 128 124 Q 129 128 126 131 Q 100 142 74 131 Z" fill="url(#pinkyRibbonGrad)"/>
    <!-- Cute Bow on Collar -->
    <!-- Left loop -->
    <path d="M 100 131 C 88 124 84 138 98 136 Z" fill="#8A254F"/>
    <!-- Right loop -->
    <path d="M 100 131 C 112 124 116 138 102 136 Z" fill="#8A254F"/>
    <!-- Center knot -->
    <ellipse cx="100" cy="133" rx="4" ry="4" fill="#741F43"/>
    <!-- Golden Heart Charm -->
    <path d="M 100 137 C 98 135 95 137 95 140 C 95 143 100 147 100 147 C 100 147 105 143 105 140 C 105 137 102 135 100 137 Z" 
          fill="url(#pinkyGoldGrad)" stroke="#E69500" stroke-width="0.8"/>
  </g>
</svg>
